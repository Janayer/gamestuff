<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameStuff V2</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #111827;
    color: white;
    overflow: hidden;
}

header {
    height: 60px;
    background: #1f2937;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px;
}

button {
    background: #7c3aed;
    color: white;

    border: none;
    border-radius: 8px;

    padding: 9px 12px;
    margin: 2px;

    cursor: pointer;
}

button:hover {
    background: #8b5cf6;
}

#game {
    position: relative;

    width: 100vw;
    height: calc(100vh - 60px);

    background: linear-gradient(
        #87ceeb 0%,
        #bde7ff 65%,
        #65a30d 65%,
        #65a30d 100%
    );

    overflow: hidden;
}

/* Spieler */

#player {

    position: absolute;

    width: 35px;
    height: 50px;

    background: #ef4444;

    border: 3px solid #991b1b;

    border-radius: 8px;

    left: 100px;
    top: 300px;

}


/* Kisten */

.box {

    position: absolute;

    width: 60px;
    height: 60px;

    background: #a16207;

    border: 4px solid #713f12;

}


/* Menü */

#menu {

    position: absolute;

    top: 10px;
    left: 10px;

    background: #111827dd;

    padding: 10px;

    border-radius: 10px;

    z-index: 10;
}


/* Info */

#info {

    position: absolute;

    bottom: 10px;
    left: 10px;

    background: #111827dd;

    padding: 10px;

    border-radius: 8px;

}

</style>

</head>

<body>


<header>

<h2>🎮 GameStuff V2</h2>

<div>

<button onclick="addBox()">
🧱 Kiste
</button>

<button onclick="saveWorld()">
💾 Speichern
</button>

<button onclick="resetWorld()">
🔄 Reset
</button>

</div>

</header>


<div id="game">


<div id="menu">

<b>Steuerung</b>

<br>

⬅️ ➡️ Bewegung

<br>

⬆️ / Leertaste = Springen

</div>


<div id="player"></div>


<div id="info">

⚙️ Physik aktiv

</div>


</div>


<script>


/* =========================
   SPIELER
========================= */


const player =
document.getElementById("player");


let playerX = 100;

let playerY = 300;


/* Geschwindigkeit */

let velocityX = 0;

let velocityY = 0;


/* Physik */

const gravity = 0.7;

const jumpPower = -13;

const speed = 5;


/* Boden */

function groundY() {

    return window.innerHeight - 110;

}


/* =========================
   TASTEN
========================= */


const keys = {};


document.addEventListener(
"keydown",
function(event) {

    keys[event.key] = true;

    keys[event.key.toLowerCase()] = true;


    /* Springen */

    if (
        event.key === " " ||
        event.key === "ArrowUp" ||
        event.key.toLowerCase() === "w"
    ) {

        if (isOnGround()) {

            velocityY = jumpPower;

        }

    }

});


document.addEventListener(
"keyup",
function(event) {

    keys[event.key] = false;

    keys[event.key.toLowerCase()] = false;

});


/* =========================
   BODEN
========================= */


function isOnGround() {

    return playerY >= groundY();

}


/* =========================
   SPIEL LOOP
========================= */


function gameLoop() {


    /* Bewegung */

    if (
        keys["ArrowLeft"] ||
        keys["a"]
    ) {

        velocityX = -speed;

    }

    else if (
        keys["ArrowRight"] ||
        keys["d"]
    ) {

        velocityX = speed;

    }

    else {

        velocityX = 0;

    }


    playerX += velocityX;


    /* Schwerkraft */

    velocityY += gravity;

    playerY += velocityY;


    /* Boden Kollision */

    if (playerY >= groundY()) {

        playerY = groundY();

        velocityY = 0;

    }


    /* Bildschirm Grenzen */

    playerX =
        Math.max(
            0,
            Math.min(
                window.innerWidth - 40,
                playerX
            )
        );


    /* Spieler anzeigen */

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";


    requestAnimationFrame(gameLoop);

}


gameLoop();



/* =========================
   KISTEN
========================= */


function addBox() {


    const box =
        document.createElement("div");


    box.className = "box";


    box.style.left =
        Math.random() *
        (window.innerWidth - 100)
        + "px";


    box.style.top =
        "100px";


    document
        .getElementById("game")
        .appendChild(box);


    makeDraggable(box);

}


/* =========================
   OBJEKTE VERSCHIEBEN
========================= */


function makeDraggable(element) {


    let dragging = false;


    element.addEventListener(
        "mousedown",
        function() {

            dragging = true;

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if (!dragging) return;


            element.style.left =
                event.clientX - 30
                + "px";


            element.style.top =
                event.clientY - 30
                + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            dragging = false;

        }
    );

}


/* =========================
   SPEICHERN
========================= */


function saveWorld() {


    const game =
        document.getElementById("game");


    localStorage.setItem(
        "gamestuff",
        game.innerHTML
    );


    alert(
        "💾 Welt gespeichert!"
    );

}


/* =========================
   RESET
========================= */


function resetWorld() {

    location.reload();

}


</script>

</body>
</html>
